/* Arquivos grandes divididos em partes pequenas (upload pelo site do GitHub) e o wasm comprimido.
   Cada parte tem ?v=VERSAO para nunca misturar partes de versoes diferentes em cache. */
(function () {
  var CFG = {"index.wasm": {"partes": ["index.wasm.p00", "index.wasm.p01", "index.wasm.p02"], "total": 39514754, "gz": true, "tipo": "application/wasm"}, "index.pck": {"partes": ["index.pck.p00", "index.pck.p01", "index.pck.p02", "index.pck.p03", "index.pck.p04"], "total": 18067492, "gz": false, "tipo": "application/octet-stream"}}, VER = "1795375706", f0 = window.fetch.bind(window);
  function parte(p) {
    var url = new URL(p, document.baseURI).href + "?v=" + VER, t = 0;
    function tentar() {
      return f0(url, t ? { cache: "reload" } : undefined).then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r;
      }).catch(function (e) {
        if (++t < 4) return new Promise(function (ok) { setTimeout(ok, 700 * t); }).then(tentar);
        throw new Error("Falha ao baixar " + p + " (" + e.message + "). Recarregue a pagina com Ctrl+F5.");
      });
    }
    var pr = tentar();
    pr.catch(function () {});
    return pr;
  }
  window.fetch = function (entrada, opcoes) {
    var url = typeof entrada === "string" ? entrada : (entrada && entrada.url) || "";
    var nome = null;
    for (var k in CFG) { if (url.split("?")[0].slice(-k.length) === k) nome = k; }
    if (!nome) return f0(entrada, opcoes);
    var c = CFG[nome], n = c.partes.length, i = 0, leitor = null, lidos = 0, prox = parte(c.partes[0]);
    var corpo = new ReadableStream({
      pull: function (ctl) {
        function ler() {
          if (!leitor) {
            if (i >= n) {
              if (!c.gz && lidos !== c.total) throw new Error("Arquivo incompleto: " + nome + " (" + lidos + " de " + c.total + " bytes). Recarregue com Ctrl+F5.");
              ctl.close(); return;
            }
            return prox.then(function (r) {
              leitor = r.body.getReader();
              i++;
              if (i < n) prox = parte(c.partes[i]);
              return ler();
            });
          }
          return leitor.read().then(function (x) {
            if (x.done) { leitor = null; return ler(); }
            lidos += x.value.length;
            ctl.enqueue(x.value);
          });
        }
        return ler();
      }
    });
    if (c.gz) {
      if (typeof DecompressionStream === "undefined") return Promise.reject(new Error("Navegador antigo: atualize o navegador."));
      corpo = corpo.pipeThrough(new DecompressionStream("gzip"));

    return Promise.resolve(new Response(corpo, { status: 200, headers: { "Content-Type": c.tipo, "Content-Length": String(c.total) } }));

})();

const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":18067492,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
